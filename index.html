<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty & Lifestyle</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background:linear-gradient(120deg,#f6d365,#fda085);
}
header{
  text-align:center;
  padding:40px;
  color:#fff;
}
header h1{font-size:36px;margin:0}
.hero{text-align:center;padding:30px;color:#fff;}
.price{
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:12px;
  display:inline-block;
  margin-top:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.price .old{color:red;text-decoration:line-through;font-weight:600}
.price .new{font-size:20px;font-weight:700;color:#ff2e63}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:20px;
}
.gallery img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}
.gallery img:hover{transform:scale(1.08)}
.section{
  padding:20px;
  background:#fff;
  margin:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}
button{
  background:#ff4d6d;
  color:#fff;
  padding:15px 30px;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
button:hover{background:#e63950}.modal{ display:none; position:fixed; top:0;left:0; width:100%;height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; } .modal img{max-width:90%;border-radius:12px}

.form-box{ display:none; position:fixed; top:50%;left:50%; transform:translate(-50%,-50%); background:#fff; color:#000; padding:20px; border-radius:12px; width:90%;max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2); } .close-btn{ position:absolute; right:12px;top:8px; font-size:22px; cursor:pointer; } input,textarea{ width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc; }

.thankyou{ display:none; position:fixed; top:50%;left:50%; transform:translate(-50%,-50%); background:#fff; color:#000; padding:25px; border-radius:12px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.2); }

footer{text-align:center;padding:15px;color:#fff} </style>

</head>
<body><header>
<h1>Beauty & Lifestyle</h1>
<p>Premium Natural Soap Collection</p>
</header><section class="hero">
<h2>✨ Natural Glow Soap ✨</h2>
<div class="price">
<p class="old">350৳ প্রতি পিস</p>
<p class="new">🔥 অফার: 2 পিস = 550৳ 🔥</p>
<p>ঢাকার ভিতরে ফ্রি ডেলিভারি 🚚</p>
</div>
</section><section class="gallery">
<img src="1777225457844.jpg" onclick="openModal(this.src)">
<img src="1777225447976.jpg" onclick="openModal(this.src)">
<img src="1777225400668.jpg" onclick="openModal(this.src)">
<img src="1777225434392.jpg" onclick="openModal(this.src)">
<img src="1777225415957.jpg" onclick="openModal(this.src)">
</section><section class="section">
<h3>⭐ Happy Customers</h3>
<div class="gallery">
<img src="review1.jpg" onclick="openModal(this.src)">
<img src="review2.jpg" onclick="openModal(this.src)">
<img src="review3.jpg" onclick="openModal(this.src)">
</div>
</section><section class="section">
<h3>✨ Before & After Result ✨</h3>
<div style="position:relative;max-width:400px;margin:auto;">
<img src="IMG_20260428_152953.png" style="width:100%;border-radius:12px;">
<div id="overlay" style="position:absolute;top:0;left:0;width:50%;overflow:hidden;border-radius:12px;">
<img src="IMG_20260428_152927.png" style="width:100%;">
</div>
<div id="slider" style="position:absolute;top:0;bottom:0;width:4px;background:#fff;left:50%;cursor:ew-resize;"></div>
</div>
</section><section style="text-align:center;margin:40px;">
<button onclick="startOrderFlow()">🛒 Order Now</button>
</section><div class="modal" id="imgModal" onclick="closeModal()">
<img id="modalImg">
</div><div class="thankyou" id="thankyou">
<h2>🎉 Thank You!</h2>
<p>Redirecting to Messenger...</p>
</div><footer>
<p>© 2026 Beauty & Lifestyle</p>
</footer><script>
function openModal(src){
  document.getElementById('imgModal').style.display='flex';
  document.getElementById('modalImg').src=src;
}
function closeModal(){
  document.getElementById('imgModal').style.display='none';
}

function startOrderFlow(){
  // show thank you first
  document.getElementById('thankyou').style.display='block';

  setTimeout(()=>{
    document.getElementById('thankyou').style.display='none';

    // then open messenger
    window.open('https://m.me/masum80448','_blank');
  },2000);
}

// slider
const slider=document.getElementById('slider');
const overlay=document.getElementById('overlay');
let isDown=false;

slider.addEventListener('mousedown',()=>isDown=true);
document.addEventListener('mouseup',()=>isDown=false);

document.addEventListener('mousemove',(e)=>{
  if(!isDown)return;
  let rect=slider.parentElement.getBoundingClientRect();
  let x=e.clientX-rect.left;
  let percent=(x/rect.width)*100;
  overlay.style.width=percent+'%';
  slider.style.left=percent+'%';
});
</script></body>
</html>
