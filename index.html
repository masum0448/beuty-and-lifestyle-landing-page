<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty & Lifestyle - Order Now</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
        .header { background: #d4a373; color: white; text-align: center; padding: 40px; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-order { background: #0084ff; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        .pricing { background: #faedcd; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Beauty & Lifestyle</h1>
</div>

<div class="container">
    <h2>আপনার অর্ডার ডিটেইলস দিন</h2>
    
    <div class="pricing">
        <p>অফার: ২ পিস সাবান মাত্র ৫৫০ টাকা!</p>
        <p>ডেলিভারি চার্জ: ফ্রি (ঢাকার ভেতরে)</p>
    </div>

    <form id="orderForm">
        <input type="text" id="name" class="input-field" placeholder="আপনার নাম" required>
        <input type="text" id="phone" class="input-field" placeholder="আপনার মোবাইল নম্বর" required>
        <textarea id="address" class="input-field" placeholder="আপনার ঠিকানা" required></textarea>
        
        <button type="button" class="btn-order" onclick="sendToMessenger()">মেসেঞ্জারে অর্ডার পাঠান</button>
    </form>
</div>

<script>
    function sendToMessenger() {
        var name = document.getElementById('name').value;
        var phone = document.getElementById('phone').value;
        var address = document.getElementById('address').value;

        if(name == "" || phone == "" || address == "") {
            alert("অনুগ্রহ করে সব তথ্য পূরণ করুন!");
            return;
        }

        var message = "আসসালামু আলাইকুম, আমি অর্ডার করতে চাই।%0A%0Aনাম: " + name + "%0Aফোন নম্বর: " + phone + "%0Aঠিকানা: " + address;
        
        // এখানে YOUR_PAGE_USERNAME এর জায়গায় আপনার ফেসবুক পেজের ইউজারনেম দিন (যেমন: fb.com/mybrand এর জন্য mybrand)
        var messengerUrl = "https://www.facebook.com/profile.php?id=61578238138543?text=" + message; 
        
        window.open(messengerUrl, '_blank');
    }
</script>

</body>
</html>
